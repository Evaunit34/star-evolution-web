<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star Evolution</title>
<style>:root{--bg:#0d0f1a;--panel:#171a2b;--panel2:#20243a;--line:#2f3552;--text:#eceaf6;--dim:#9aa0bd;--gold:#e8b84a;--accent:#7c8cff;--bad:#ff6b6b;--good:#5ad08a;
--sideA:#e8b84a;--sideB:#8a6bd6;--land:#5a4a2a;--water:#16324d;--tile:#252a44}
html.cb{--sideA:#0072B2;--sideB:#E69F00;--accent:#56B4E9;--good:#009E73;--bad:#D55E00}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:1rem 16px;overflow:auto;text-align:center}
.logo{font-weight:800;letter-spacing:.18em;font-size:clamp(1.7rem,8vw,3rem);background:linear-gradient(90deg,#ffe29a,#e8b84a,#9b86ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.sub{color:var(--dim);margin:0;font-size:.95rem}
.hero{width:min(320px,70vw);height:auto}
.menu{display:flex;flex-direction:column;gap:.6rem;width:min(340px,100%)}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;min-height:48px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:linear-gradient(180deg,#5b6cff,#4453d8);border-color:#7c8cff;font-weight:700}
button.dim{opacity:.55}button:disabled{opacity:.4;cursor:not-allowed}
button.small{min-height:40px;padding:.4rem .7rem;font-size:.9rem}
.cards{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;width:min(300px,100%);text-align:left;cursor:pointer}
.card:hover{border-color:var(--accent)}.card h3{margin:.3rem 0}.card ul{margin:.3rem 0 0;padding-left:1.1rem;color:var(--dim);font-size:.9rem}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;width:min(440px,100%);text-align:left;display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;align-items:center;gap:.6rem;justify-content:space-between;flex-wrap:wrap}
.row label{display:flex;align-items:center;gap:.5rem}.row input[type=range]{flex:1;min-width:120px}
input[type=checkbox]{width:22px;height:22px}
.note{color:var(--dim);font-size:.85rem}
table.keys{border-collapse:collapse;width:100%;font-size:.9rem}table.keys td{padding:.2rem .3rem;border-bottom:1px solid var(--line)}kbd{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 .4rem}
/* match */
.match{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.4rem 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.score{display:flex;gap:.4rem;align-items:center;font-weight:700}.score .sw{width:14px;height:14px;display:inline-block}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;font-size:.9rem}
.turnpill{font-weight:700}
.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
svg.board{width:100%;height:100%;max-height:100%;touch-action:manipulation}
.hint{background:#2a2f55;border-top:1px solid var(--accent);padding:.4rem 10px;font-size:.9rem;display:flex;gap:.6rem;align-items:center;justify-content:space-between}
.panel{background:var(--panel);border-top:1px solid var(--line);padding:.5rem 10px calc(.5rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.4rem}
.uinfo{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;font-size:.9rem}
.bar{height:8px;background:#000;border-radius:5px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--good)}.bar.chi i{background:var(--accent)}
.actions{display:flex;gap:.4rem;flex-wrap:wrap}
.actions button{flex:1 1 auto;min-width:76px;padding:.4rem .5rem;font-size:.9rem}
.actions button.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.actions button.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(124,140,255,.55)}}
.log{font-size:.8rem;color:var(--dim);max-height:3.9em;overflow:hidden;display:flex;flex-direction:column-reverse}
.log .points{color:var(--gold)}.log .kill{color:var(--bad)}.log .level{color:var(--good)}
.overlay{position:fixed;inset:0;background:rgba(5,6,12,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.2rem;max-width:420px;width:100%;display:flex;flex-direction:column;gap:.8rem;text-align:center}
.modal h2{margin:0}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:.5rem .9rem;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.end td,.end th{padding:.2rem .6rem}.end table{margin:0 auto}
@media (min-width:900px){.match{flex-direction:row;flex-wrap:wrap}.top{width:100%}.boardwrap{flex:1 1 60%}.side{flex:0 0 330px;display:flex;flex-direction:column;justify-content:flex-end}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Pass B: tutorial, guide, practice */
.modal.wide{max-width:560px;max-height:94dvh;overflow:auto}
.tsvg{width:100%;height:auto;background:#0f1222;border:1px solid var(--line);border-radius:12px}
.ttext{margin:.2rem 0;text-align:left;font-size:.98rem}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}.dots i.on{background:var(--gold)}
.trow{display:flex;gap:.5rem}.trow button{flex:1}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap}.tabs button{flex:1;min-height:40px;padding:.3rem .5rem;font-size:.9rem}.tabs button.on{border-color:var(--gold);background:var(--panel)}
.guide #g-body{text-align:left}.guide h2{font-size:1.1rem;margin:.6rem 0 .3rem}.gl{margin:.2rem 0;padding-left:1.1rem;color:var(--dim);font-size:.88rem}.ucard{border-top:1px solid var(--line);padding:.4rem 0}
.actions button.newbtn{animation:pulse 1.1s infinite;border-color:var(--gold)}
.hint button.link{background:none;border:none;color:var(--dim);text-decoration:underline;min-height:0;padding:0 .3rem;font-size:.8rem}
.field{display:flex;flex-direction:column;gap:.3rem;text-align:left}.field select{font:inherit;padding:.6rem;border-radius:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.modal>*{flex-shrink:0}.modal #t-host,.modal #g-body{display:flex;flex-direction:column;gap:.7rem}.modal #t-host>*,.modal #g-body>*{flex-shrink:0}

.glow{animation:glowp 1.4s ease-in-out infinite}@keyframes glowp{50%{opacity:.45}}
.tip{font-size:.85rem;color:#c9cde6;background:#232845;border-left:3px solid var(--accent);padding:.3rem .5rem;border-radius:6px}

.hint.stage{background:#3a3414;border-top:1px solid #ffd84a}
.emb{width:1.3em;height:1.3em;vertical-align:-.28em;background:#dfe3f3;border-radius:50%;padding:2px;box-sizing:content-box}.emb.big{width:2.2rem;height:2.2rem;padding:.3rem;display:inline-block;margin:0 .7rem .3rem 0;vertical-align:middle}
.card>svg{vertical-align:middle;margin-bottom:.3rem}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cover{height:min(40dvh,520px);aspect-ratio:2625/3375;object-fit:cover;border-radius:10px;border:1px solid var(--line);box-shadow:0 0 34px rgba(232,184,74,.16)}
.boardwrap{background:linear-gradient(rgba(10,12,22,.5),rgba(10,12,22,.5)),var(--mapbg,none) center/cover}
.emb.head{border-radius:8px;padding:0;background:none;width:1.9em;height:1.9em;object-fit:cover;vertical-align:-.6em;border:2px solid var(--line)}
.th{width:1.6em;height:1.6em;border-radius:6px;object-fit:cover;vertical-align:-.45em}
.edge.up{color:#7dffa6}.edge.dn{color:#ffb35c}.edgenote{margin:.3rem 0 0;line-height:1.5}.kill{color:#ff9b9b}
.preview{background:#22284a;border:1px solid var(--accent);border-radius:10px;padding:.5rem .7rem;margin:.3rem 0;display:flex;flex-direction:column;gap:.25rem;font-size:.92rem}
.prow{display:flex;gap:.5rem}.prow button{flex:1}
@media (max-width:899px){.boardwrap{min-height:36dvh}.side{min-height:0;overflow:auto;flex:0 1 auto}.match{overflow:hidden}}
.burn{display:flex;align-items:center;gap:.5rem;min-height:44px;font-size:.9rem}.burn input{width:22px;height:22px}
/* attack animations (drawn by js/fx.js) */
.fx-shot{animation:fxshot .26s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes fxshot{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:1}}
.fx-ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:fxring .5s ease-out forwards}
.fx-ring2{opacity:0;animation-name:fxring2;animation-duration:.6s}
@keyframes fxring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.9)}}
@keyframes fxring2{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2)}}
.fx-spark{opacity:0;animation:fxspark .45s ease-out forwards}
@keyframes fxspark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.fx-num{opacity:0;font-weight:800;font-size:20px;paint-order:stroke;stroke:#10121c;stroke-width:4px;stroke-linejoin:round;animation:fxnum 1s ease-out forwards}
.fx-dmg{fill:#ff6b5e}.fx-miss{fill:#cfd6ff;font-size:16px}.fx-heal{fill:#7dff9a}.fx-ko{fill:#ffd25a;font-size:15px}
@keyframes fxnum{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.fx-hit{animation:fxhit .4s linear both;transform-box:fill-box;transform-origin:center}
@keyframes fxhit{0%{transform:translate(0,0);filter:brightness(1)}10%{transform:translate(-5px,0);filter:brightness(2.2)}25%{transform:translate(5px,0)}40%{transform:translate(-4px,0);filter:brightness(1.4)}60%{transform:translate(3px,0)}100%{transform:translate(0,0);filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.fx-shot,.fx-ring,.fx-spark,.fx-num,.fx-hit{animation-duration:.01s}}
a.btn{display:flex;align-items:center;justify-content:center;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;min-height:48px;text-decoration:none}
a.btn:hover{border-color:var(--accent)}a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note a{color:var(--accent)}
img.credits{display:block;margin:1rem auto 0;width:min(340px,86%);height:auto;opacity:.7}
</style>
</head>

  return left>=P.cost?(u.level>=3?P.bonusL3:P.bonus):0;};
R.targets=function(st,u,techId){
  var tech=R.tech(techId);if(!R.canAct(st,u)||u.acted||!R.canUse(u,tech)||(tech.selfHp&&u.hp-tech.selfHp<=0))return [];
  return st.units.filter(function(t){return !t.dead&&t.side!==u.side&&H.dist(u,t)<=tech.range;});
};
R.attack=function(st,u,techId,targetId){
  var tech=R.tech(techId),t=R.unitById(st,targetId);
  if(!t||R.targets(st,u,techId).indexOf(t)<0)return {ok:false,msg:"Can't attack that."};
  var sp=D().rules.damageSpread||0,dmg=Math.max(1,R.damageOf(u,t,tech)+(sp?Math.floor(st.rng()*(2*sp+1))-sp:0));
  var bb=R.burnBonus(st,u,tech);if(bb){dmg+=bb;}

  if(bb){u.chi.p-=R.passive(u).cost;log(st,u.name+"'s "+R.passive(u).name+": burns "+R.passive(u).cost+" chi for +"+bb+" damage.","info");}
  if(tech.copy)u.techs=u.techs.filter(function(x){return x!==techId;});   // a copied technique is single use
  if(tech.selfHp){u.hp-=tech.selfHp;log(st,u.name+" loses "+tech.selfHp+" HP using "+tech.name+".","hurt");}
  u.acted=true;
  var fxF={q:u.q,r:u.r},fxT={q:t.q,r:t.r},fxPow=tech.grey?0:1;
  var guard=R.rollGuard(st,u,t);
  if(guard){R.emit(st,{t:"attack",from:fxF,to:fxT,side:u.side,dmg:0,avoided:true,big:fxPow,heal:t.hp});log(st,u.name+" uses "+tech.name+" on "+t.name+" but it is avoided.","info");R.checkEnd(st);return {ok:true,dmg:0,killed:false,avoided:true,procs:[guard]};}
  t.hp-=dmg;
  log(st,u.name+" uses "+tech.name+" on "+t.name+" for "+dmg+".","hit");
  var procs=t.hp>0?R.rollHit(st,u,t):[];
  var killed=false;
  R.grantExp(st,u,D().rules.perHitExp);
  if(t.hp<=0){
    t.hp=0;t.dead=true;killed=true;var P=D().rules.points;
    log(st,t.name+" is defeated!","kill");
    if(t.boss){addPoints(st,u.side,P.miniBossMult*t.level,"mini boss");R.grantLevels(st,u,D().rules.bossLevelUp);}
    else{addPoints(st,u.side,P.kill,"kill");R.grantExp(st,u,D().rules.killExp);}
  }
  else procs=procs.concat(R.rollStruck(st,u,t,techId));
  R.passiveOnHit(st,u,t);
  R.emit(st,{t:"attack",from:fxF,to:fxT,side:u.side,dmg:dmg,extra:procs.filter(function(p){return p.type==="flat";}).reduce(function(a,p){return a+p.n;},0),healed:procs.filter(function(p){return p.type==="heal";}).reduce(function(a,p){return a+p.n;},0),killed:killed,big:fxPow,tid:t.id});
  R.checkEnd(st);
  return {ok:true,dmg:dmg,killed:killed,procs:procs};
};

// ---- Instincts (chance procs) and faction passives. Data: data/instincts.js ----
R.instinctChance=function(u){var C=D().instincts.chance;return Math.min(1,C.base+C.perLevel*(u.level-1));};
R.instinctList=function(u,when){var I=D().instincts;return (u.instincts||[]).map(function(id){return Object.assign({id:id},I.defs[id]);}).filter(function(x){return x.type&&(!when||x.when.indexOf(when)>=0);});};
R.instinctCost=function(I){return I.cost!==undefined?I.cost:D().instincts.cost;};
R.canProc=function(u,I){return (u.chi.s||0)>=R.instinctCost(I);};
R.tryProc=function(st,u,I){if(!R.canProc(u,I)||st.rng()>=R.instinctChance(u))return false;u.chi.s-=R.instinctCost(I);return true;};
R.passive=function(u){var P=D().instincts.passives;return P&&P[u.faction]||null;};
R.pierce=function(u){var P=R.passive(u);return P&&P.type==="pierce"?Math.round(P.base+P.perLevel*(u.level-1)):0;};
R.passiveText=function(u){var P=R.passive(u);if(!P)return "";return P.name+": "+(P.type==="pierce"?"attacks ignore "+R.pierce(u)+" DEF (+"+P.perLevel+" per level)":P.text);};
// attacker instincts after a hit that leaves the target alive
R.rollHit=function(st,u,t){
  var out=[];
  R.instinctList(u,"hit").forEach(function(I){
    if(t.dead||t.hp<=0||!R.tryProc(st,u,I))return;
    var n=I.min+Math.floor(st.rng()*(I.max-I.min+1));
    if(I.type==="flat"){t.hp-=n;out.push({id:I.id,name:I.name,type:"flat",n:n});log(st,u.name+"'s "+I.name+" triggers: "+n+" extra damage to "+t.name+".","hit");}
    else if(I.type==="heal"){var hh=Math.min(n,u.maxHp-u.hp);u.hp+=hh;out.push({id:I.id,name:I.name,type:"heal",n:hh});log(st,u.name+"'s "+I.name+" triggers: heals "+hh+" HP.","hit");}
    else if(I.type==="drain"){var took=Math.min(n,t.chi.p||0);t.chi.p-=took;out.push({id:I.id,name:I.name,type:"drain",n:took});log(st,u.name+"'s "+I.name+" triggers: "+t.name+" loses "+took+" chi.","hit");}
  });
  return out;};
// defender instincts before damage: returns the proc that avoided the hit, or null
R.rollGuard=function(st,u,t){
  var hit=null;
  R.instinctList(t,"guard").some(function(I){
    if(I.type!=="avoid"||!R.tryProc(st,t,I))return false;
    if(I.recoverS)t.chi.s=Math.min(t.maxChi.s,t.chi.s+I.recoverS);
    if(I.drainS)u.chi.s=Math.max(0,u.chi.s-I.drainS);
    if(I.healHp)t.hp=Math.min(t.maxHp,t.hp+I.healHp);
    hit={id:I.id,name:I.name,type:"avoid"};
    log(st,t.name+"'s "+I.name+" triggers: the hit is avoided"+(I.recoverS?" and "+t.name+" recovers "+I.recoverS+" secondary chi":"")+(I.drainS?" and "+u.name+" loses "+I.drainS+" secondary chi":"")+(I.healHp?" and "+t.name+" heals "+I.healHp+" HP":"")+".","hit");return true;});
  return hit;};
// copy: gain one of the enemy's techniques (single use, expires at the end of the owner's next turn)
R.copyId=function(srcId,penalty){return "copy:"+srcId+":"+penalty;};
R.isCopy=function(id){return String(id).indexOf("copy:")===0;};
R.giveCopy=function(st,c,from,srcId,I){
  c.techs=c.techs.filter(function(x){return !R.isCopy(x);});
  var id=R.copyId(srcId,I.penalty);c.techs.push(id);c.copyTtl=1;
  log(st,c.name+" copies "+D().techniques[srcId].name+" from "+from.name+" ("+I.name+", -"+I.penalty+" power). Usable on its next action.","hit");return id;};
R.copyable=function(from){return from.techs.filter(function(id){var t=D().techniques[id];return t&&!R.isCopy(id)&&(t.unlock||1)<=from.level;});};
R.rollStruck=function(st,u,t,techId){
  var out=[];
  R.instinctList(t,"struck").forEach(function(I){
    if(I.type!=="copy"||t.dead||t.hp<=0||!R.tryProc(st,t,I))return;
    var src=(D().techniques[techId]&&!R.isCopy(techId))?techId:null;
    if(!src){var c=R.copyable(u);if(!c.length){t.chi.s+=R.instinctCost(I);return;}src=c[Math.floor(st.rng()*c.length)];}
    out.push({id:I.id,name:I.name,type:"copy",tech:R.giveCopy(st,t,u,src,I)});});
  return out;};
R.nearTriggers=function(st,side){
  R.alive(st,side).forEach(function(u){
    R.instinctList(u,"near").forEach(function(I){
      if(I.type!=="copy")return;
      var foes=st.units.filter(function(e){return !e.dead&&!e.boss&&e.side!==side&&e.side!=="N"&&H.dist(u,e)<=I.range&&R.copyable(e).length;});
      if(!foes.length||!R.tryProc(st,u,I))return;
      foes.sort(function(a,b){return H.dist(u,a)-H.dist(u,b);});var e=foes[0],c=R.copyable(e);
      R.giveCopy(st,u,e,c[Math.floor(st.rng()*c.length)],I);});});};
R.expireCopies=function(st,side){
  R.alive(st,side).forEach(function(u){if(u.copyTtl){u.copyTtl--;if(u.copyTtl<=0){u.techs=u.techs.filter(function(x){return !R.isCopy(x);});}}});};
// passive that triggers on every landed hit (Cultists: all enemies lose HP, never defeated)
R.passiveOnHit=function(st,u,t){
  var P=R.passive(u);if(!P||P.type!=="aura"||st.opts.stage)return;var n=0;
  st.units.forEach(function(e){if(e.dead||e.boss||e.side===u.side||e.side==="N")return;if(P.scope==="target"&&e!==t)return;if(e.hp>1){e.hp=Math.max(1,e.hp-P.hp);n++;}});
  if(n&&P.leech&&u.hp<u.maxHp){var g=Math.min(P.leech,u.maxHp-u.hp);u.hp+=g;log(st,u.name+" steals "+g+" HP.","hit");}
  if(n)log(st,u.name+"'s "+P.name+": "+(P.scope==="target"?t.name:"all enemies")+" lose"+(P.scope==="target"?"s ":" ")+P.hp+" HP.","hit");};
// Star Warriors passive: at the end of their turn each living unit heals HP equal to its level
R.regenTurn=function(st,side){
  if(st.opts.stage)return;
  var us=R.alive(st,side).filter(function(u){return !u.boss;}),P=us[0]&&R.passive(us[0]);if(!P||P.type!=="regen")return;
  function heal(u,n){var h=Math.min(n,u.maxHp-u.hp);if(h>0){u.hp+=h;log(st,u.name+"'s "+P.name+": heals "+h+" HP.","info");}}
  if(P.mode==="pool"){   // one shared pool = average level of the living units, given to the most hurt unit
    var n=Math.round(us.reduce(function(a,u){return a+u.level;},0)/us.length),hurt=us.filter(function(u){return u.hp<u.maxHp;}).sort(function(a,b){return (a.hp/a.maxHp)-(b.hp/b.maxHp);})[0];

  else us.forEach(function(u){if(P.restOnly&&u.acted)return;heal(u,Math.min(u.level,P.cap||99));});};
R.claimCost=function(u){return D().rules.claimDamageMult*u.level;};
R.canClaim=function(st,u){
  if(!R.canAct(st,u)||u.acted)return {ok:false,msg:"Can't act."};
  var k=H.key(u.q,u.r);
  if(!(k in st.land))return {ok:false,msg:"Stand on a land tile to claim it."};
  if(st.land[k]===u.side)return {ok:false,msg:"You already hold this land."};
  if(u.hp-R.claimCost(u)<=0)return {ok:false,msg:"You don't have enough HP to claim (costs "+R.claimCost(u)+")."};
  return {ok:true};
};
R.claim=function(st,u){
  var c=R.canClaim(st,u);if(!c.ok)return c;
  var k=H.key(u.q,u.r),prev=st.land[k],cost=R.claimCost(u);
  u.hp-=cost;st.land[k]=u.side;u.acted=true;
  R.emit(st,{t:"claim",at:{q:u.q,r:u.r},side:u.side});
  log(st,u.name+" claims land (-"+cost+" HP)"+(prev?" from the enemy":"")+".","claim");
  addPoints(st,u.side,D().rules.points.land,prev?"land stolen":"land");
  if(!st.claimed[u.side][k]){st.claimed[u.side][k]=true;R.grantLevels(st,u,D().rules.claimLevels);} // level only once per tile per side
  R.checkEnd(st);return {ok:true};
};

R.canOpen=function(st,u){
  if(!R.canAct(st,u)||u.acted)return {ok:false,msg:"Can't act."};
  if(!(H.key(u.q,u.r) in st.chests))return {ok:false,msg:"No chest here."};return {ok:true};
};
R.open=function(st,u){
  var c=R.canOpen(st,u);if(!c.ok)return c;
  var k=H.key(u.q,u.r),lv=st.chests[k];delete st.chests[k];u.acted=true;
  R.emit(st,{t:"chest",at:{q:u.q,r:u.r},side:u.side});
  log(st,u.name+" opens a chest.","chest");
  addPoints(st,u.side,D().rules.points.chestPerLevel*lv,"chest");
  R.grantLevels(st,u,D().rules.chestLevels);R.checkEnd(st);return {ok:true};
};

R.canTalk=function(st,u){
  if(!R.canAct(st,u)||u.acted)return {ok:false,msg:"Can't act."};
  if(H.dist(u,st.npc)>1)return {ok:false,msg:"Stand next to the "+st.npc.name+" to talk."};
  if(st.talked[u.side])return {ok:false,msg:"Your side already spoke with the "+st.npc.name+"."};return {ok:true};
};
R.talk=function(st,u){
  var c=R.canTalk(st,u);if(!c.ok)return c;
  R.emit(st,{t:"talk",at:{q:u.q,r:u.r},side:u.side});st.talked[u.side]=true;u.acted=true;log(st,u.name+" speaks with the "+st.npc.name+".","talk");
  addPoints(st,u.side,D().rules.points.npcTalk,"talked to NPC");R.checkEnd(st);return {ok:true};
};

R.landCount=function(st,side){return st.landTiles.filter(function(k){return st.land[k]===side;}).length;};
R.hpSum=function(st,side){return R.alive(st,side).reduce(function(a,u){return a+u.hp;},0);};
R.finish=function(st,winner,reason){if(st.over)return;st.over=true;st.winner=winner;st.endReason=reason;
  log(st,winner?(st.names[winner]+" wins ("+reason+")."):"Draw ("+reason+").","end");};
R.checkEnd=function(st){
  if(st.over)return true;var a=R.alive(st,"A").length,b=R.alive(st,"B").length,lim=st.opts.pointLimit;
  if(!st.opts.respawn&&a===0&&b===0){R.finish(st,null,"wipe-out");return true;}
  if(!st.opts.respawn&&a===0){R.finish(st,"B","wipe-out");return true;}
  if(!st.opts.respawn&&b===0){R.finish(st,"A","wipe-out");return true;}
  var pa=st.points.A>=lim,pb=st.points.B>=lim;
  if(pa&&pb){R.finish(st,st.points.A>=st.points.B?(st.points.A===st.points.B?null:"A"):"B","point limit");return true;}
  if(pa){R.finish(st,"A","point limit");return true;}
  if(pb){R.finish(st,"B","point limit");return true;}
  return false;
};
// Used for clock or round limit: higher points, then land held, then total HP.
R.endByLimit=function(st,reason){
  if(st.over)return;
  var cmp=[[st.points.A,st.points.B],[R.landCount(st,"A"),R.landCount(st,"B")],[R.hpSum(st,"A"),R.hpSum(st,"B")]];
  for(var i=0;i<cmp.length;i++){if(cmp[i][0]!==cmp[i][1]){R.finish(st,cmp[i][0]>cmp[i][1]?"A":"B",reason);return;}}
  R.finish(st,null,reason);
};

function bossPhase(st){
  if(!D().rules.bossRetaliates)return;
  st.units.filter(function(b){return b.boss&&!b.dead;}).forEach(function(b){
    st.units.filter(function(t){return !t.dead&&!t.boss&&H.dist(b,t)<=1;}).forEach(function(t){
      var d=Math.max(1,b.atk-t.def);t.hp-=d;log(st,b.name+" strikes "+t.name+" for "+d+".","hurt");
      if(t.hp<=0){t.hp=0;t.dead=true;log(st,t.name+" falls to the "+b.name+".","kill");}
    });});
  R.checkEnd(st);
}
function respawnDead(st,side){
  st.units.filter(function(u){return u.dead&&!u.boss&&u.side===side;}).forEach(function(u){
    var spot=null,reach=H.reachable(u.home,3,function(q,r){return R.inBoard(st,q,r)&&!st.water[H.key(q,r)];});
    Object.keys(reach).sort(function(a,b){return reach[a].d-reach[b].d;}).some(function(k){var t=reach[k];
      if(!R.unitAt(st,t.q,t.r)&&!(st.npc.q===t.q&&st.npc.r===t.r)){spot=t;return true;}return false;});
    if(!spot)return;
    u.dead=false;u.q=spot.q;u.r=spot.r;u.hp=Math.max(1,Math.ceil(u.maxHp*D().rules.respawnHpFrac));u.chi={p:0,s:0};u.moved=true;u.acted=true;u.idle=true;u.techs=u.techs.filter(function(x){return !R.isCopy(x);});u.copyTtl=0;
    log(st,u.name+" returns to the field.","info");});
}
R.endTurn=function(st){
  if(st.over)return;
  var prev=st.turn;
  if(prev==="B"){bossPhase(st);if(st.over)return;st.round++;
    if(st.opts.roundLimit&&st.round>st.opts.roundLimit){R.endByLimit(st,"round limit");return;}}
  R.expireCopies(st,prev);
  R.regenTurn(st,prev);
  st.turn=R.other(prev);
  R.alive(st,st.turn).forEach(function(u){u.moved=false;u.acted=false;u.idle=false;var rg=D().rules.chiRegen;['p','s'].forEach(function(k){u.chi[k]=rg==="full"?u.maxChi[k]:Math.min(u.maxChi[k],u.chi[k]+rg);});});
  if(st.opts.respawn)respawnDead(st,st.turn);
  R.nearTriggers(st,st.turn);
  R.emit(st,{t:"turn",side:st.turn});
  log(st,"Round "+st.round+": "+st.names[st.turn]+" turn.","turn");
};
R.allDone=function(st,side){return R.alive(st,side).every(function(u){return u.acted&&u.moved;});};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>// Basic CPU: priority list with small jitter, no lookahead. (Harder Standard CPU is Pass C.)
(function(G){var SE=G.SE=G.SE||{data:{}};
var H=SE.hex,R=SE.rules,AI=SE.ai={};
AI.cfg={threat:2.5,threatLow:7,jitter:7};
function bestAttack(st,u){
  var best=null;
  u.techs.forEach(function(id){
    var tech=R.tech(id);
    R.targets(st,u,id).forEach(function(t){
      var dmg=R.damageOf(u,t,tech),kill=dmg>=t.hp,pts=0;
      if(kill)pts=t.boss?SE.data.rules.points.miniBossMult*t.level:SE.data.rules.points.kill;
      var s=dmg+(kill?12+pts*2:0)+(t.boss?-3:2)-tech.cost*0.4-(tech.selfHp||0)*1.2;
      if(!t.boss&&t.hp-dmg<=0)s+=3;
      if(!best||s>best.s)best={s:s,type:"attack",unit:u,tech:id,target:t};
    });});
  return best;
}
function objectives(st,u){
  var out=[],k;
  st.landTiles.forEach(function(key){if(st.land[key]!==u.side){var p=key.split(",");out.push({q:+p[0],r:+p[1],w:st.claimed[u.side][key]?0.4:1});}});
  for(k in st.chests){var p=k.split(",");out.push({q:+p[0],r:+p[1],w:0.8});}
  if(!st.talked[u.side])out.push({q:st.npc.q,r:st.npc.r,w:0.9});
  st.units.forEach(function(e){if(!e.dead&&e.side!=="N"&&e.side!==u.side)out.push({q:e.q,r:e.r,w:0.7});});
  return out;
}
function threat(st,u,at){
  var n=0;st.units.forEach(function(e){if(e.dead||e.side===u.side)return;
    var reach=e.boss?1:e.move+Math.max.apply(null,e.techs.map(function(id){return R.tech(id).range;}));
    if(H.dist(e,at)<=reach)n++;});return n;
}
function tileScore(st,u,at,objs){
  var rules=SE.data.rules,key=H.key(at.q,at.r),s=0,hpAfter=u.hp-R.claimCost(u);
  if(key in st.land&&st.land[key]!==u.side&&hpAfter>3)s+=st.land[key]===null?40:45;
  if(key in st.chests)s+=26;
  if(!st.talked[u.side]&&H.dist(at,st.npc)<=1)s+=30;
  var ghost={q:at.q,r:at.r,side:u.side};
  st.units.forEach(function(e){if(e.dead||e.side===u.side)return;
    u.techs.forEach(function(id){var tech=R.tech(id);
      if(R.canUse(u,tech)&&H.dist(at,e)<=tech.range){var dmg=R.damageOf(u,e,tech);s+=Math.min(dmg,e.hp)*0.35+(dmg>=e.hp?12:0)+(e.boss?-6:0);}});});
  var md=99,bw=1;objs.forEach(function(o){var d=H.dist(at,o)/o.w;if(d<md)md=d;});
  s-=md*1.4;
  s-=threat(st,u,at)*(u.hp<u.maxHp*0.5?AI.cfg.threatLow:AI.cfg.threat);
  s+=st.rng()*AI.cfg.jitter;return s;
}
AI.nextAction=function(st){
  var side=st.turn,units=R.alive(st,side);
  for(var i=0;i<units.length;i++){
    var u=units[i];if(u.idle)continue;
    if(!u.acted){
      // Priority: a kill, then claim land (10 pts), talk (5), chest, then any attack.
      var a=bestAttack(st,u),canKill=a&&a.target.hp<=R.damageOf(u,a.target,R.tech(a.tech));
      var onLandOK=R.canClaim(st,u).ok&&u.hp-R.claimCost(u)>3;
      if(canKill&&!(onLandOK&&a.target.boss))return a;
      if(onLandOK)return {type:"claim",unit:u};
      if(R.canTalk(st,u).ok)return {type:"talk",unit:u};
      if(R.canOpen(st,u).ok)return {type:"open",unit:u};
      if(a)return a;
    }
    if(!u.moved&&!u.acted){
      var objs=objectives(st,u),cur=tileScore(st,u,u,objs),best=null;
      R.legalMoves(st,u).forEach(function(m){var s=tileScore(st,u,m,objs);if(s>cur+0.5&&(!best||s>best.s))best={s:s,q:m.q,r:m.r};});
      if(best)return {type:"move",unit:u,q:best.q,r:best.r};
      u.moved=true; // chose to hold position
      if(!u.acted)return AI.nextAction(st);
    }

  while(!st.over&&guard-->0&&(a=AI.nextAction(st))){var r=AI.apply(st,a);if(!r.ok){a.unit.idle=true;}}

};

<script>// Small SVG drawings of the board pieces, used by the tutorial and guide (same look as the board).
(function(G){var SE=G.SE=G.SE||{data:{}};
var A=SE.art={};
function pts(cx,cy,r){var a=[];for(var i=0;i<6;i++){var t=Math.PI/3*i;a.push((cx+r*Math.cos(t)).toFixed(1)+","+(cy+r*Math.sin(t)).toFixed(1));}return a.join(" ");}
A.reduced=function(){try{return G.matchMedia&&G.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}};
A.hex=function(cx,cy,r,o){o=o||{};return '<polygon points="'+pts(cx,cy,r)+'" fill="'+(o.fill||"#252a44")+'" stroke="'+(o.stroke||"#3a4166")+'" stroke-width="'+(o.sw||1.5)+'"'+(o.dash?' stroke-dasharray="4 3"':"")+'/>';};
A.land=function(cx,cy,r,owner){return A.hex(cx,cy,r-1.5,{fill:"#5a4a2a"})+A.hex(cx,cy,r*0.62,{fill:"none",stroke:owner||"#b79a5a",sw:owner?3:1.5,dash:!owner})+(owner?"":'<text x="'+cx+'" y="'+(cy+r*0.48)+'" text-anchor="middle" fill="#d9c28a" font-size="11">+10</text>');};
A.water=function(cx,cy,r){return A.hex(cx,cy,r-1.5,{fill:"#16324d"})+'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" fill="#4a7fa8" font-size="16">≈</text>';};
A.chest=function(cx,cy){return '<rect x="'+(cx-9)+'" y="'+(cy-7)+'" width="18" height="13" rx="2" fill="#d8a53a" stroke="#6b4b10"/><rect x="'+(cx-9)+'" y="'+(cy-7)+'" width="18" height="5" rx="2" fill="#e8bd5a" stroke="#6b4b10"/>';};
A.npc=function(cx,cy,r){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#e9e4d0" stroke="#8a7f55" stroke-width="2"/><text x="'+cx+'" y="'+(cy+r*0.32)+'" text-anchor="middle" font-size="'+(r*1.1)+'" font-weight="700" fill="#4a4126">?</text>';};
A.boss=function(cx,cy,r,lvl){return '<polygon points="'+pts(cx,cy,r)+'" fill="#c9443c" stroke="#2b0d0b" stroke-width="2"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#10121c">W</text>'+(lvl?'<text x="'+(cx+r*0.8)+'" y="'+(cy-r*0.6)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" stroke="#000" stroke-width=".6">L'+lvl+'</text>':"");};
// f: {shape,color,letter,level,hp(0-1)}
A.unit=function(cx,cy,r,f){
  var col=f.color||"#bbb",s="";
  if(f.shape==="square")s='<rect x="'+(cx-r)+'" y="'+(cy-r)+'" width="'+(2*r)+'" height="'+(2*r)+'" rx="4" fill="'+col+'" stroke="#000" stroke-width="2"/>';
  else if(f.shape==="diamond")s='<polygon points="'+cx+","+(cy-r*1.2)+" "+(cx+r*1.2)+","+cy+" "+cx+","+(cy+r*1.2)+" "+(cx-r*1.2)+","+cy+'" fill="'+col+'" stroke="#000" stroke-width="2"/>';
  else s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+col+'" stroke="#000" stroke-width="2"/>';
  s+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#10121c">'+(f.letter||"")+'</text>';
  if(f.hp!=null)s+='<rect x="'+(cx-r)+'" y="'+(cy+r*1.2)+'" width="'+(2*r)+'" height="5" fill="#000"/><rect x="'+(cx-r)+'" y="'+(cy+r*1.2)+'" width="'+(2*r*f.hp)+'" height="5" fill="#5ad08a"/>';
  if(f.level)s+='<text x="'+(cx+r)+'" y="'+(cy-r*0.7)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" stroke="#000" stroke-width=".6">L'+f.level+'</text>';
  return s;
};

<script>// Guided tutorial stage: one scripted turn on a near-empty board. State-driven (the step is worked out from
// the match state every render), so it cannot get stuck. The real engine and UI run underneath.
(function(G){var SE=G.SE=G.SE||{data:{}};
var H=SE.hex,R=SE.rules,ST=SE.stage={};
var K=function(p){return H.key(p.q,p.r);};
var TEXT={
  pick1:"Tap your glowing unit to select it.",
  move1:"Each unit gets one move and one action per turn. Tap the glowing tile to move closer to the enemy.",
  attack:"The enemy is in range (red ring). Tap it to attack.",
  confirm:"This shows what the attack will do. Tap Confirm attack to go ahead (or tap the enemy again).",
  pick2:"That unit has used its action. Now tap your other glowing unit.",
  move2:"Tap the glowing land tile to walk onto it.",
  claim:"Press the glowing Claim button. Land costs a little HP, earns 10 star points and a level.",
  end:"The land now shows your colour. Press End turn to finish the lesson."
};
var ORDER=["pick1","move1","attack","pick2","move2","claim","end"];

ST.opts=function(faction,next){
  var F=Object.keys(SE.data.units.factions),opp=F.filter(function(f){return f!==faction;})[0]||faction;
  return {faction:faction,opponent:opp,rules:"basic",pointLimit:100000,clockMin:0,roundLimit:0,respawn:true,firstSide:"A",hints:false,stage:true,stageNext:next||"Start match",seed:(Date.now()&0xffffff)};
};

ST.setup=function(v){
  var st=v.st,A=st.units.filter(function(u){return u.side==="A"&&!u.boss;}),B=st.units.filter(function(u){return u.side==="B"&&!u.boss;});
  var u1=A[0],u2=A[1]||A[0],e=B[0];
  st.units=[u1].concat(u2!==u1?[u2]:[],[e]);
  [u1,u2,e].forEach(function(u){u.instincts=[];});   // keep the lesson predictable: no procs
  st.opts.stage=true;
  st.land={};st.landTiles=[];st.chests={};st.turn="A";
  function put(u,c,r){var h=H.fromOffset(c,r);u.q=h.q;u.r=h.r;u.home={q:h.q,r:h.r};}
  put(u1,1,2);put(u2,1,4);put(e,8,6);
  // where unit 1 should walk: the legal tile farthest from its start
  var s1={q:u1.q,r:u1.r},legal=R.legalMoves(st,u1),T=legal.slice().sort(function(a,b){return H.dist(s1,b)-H.dist(s1,a);})[0];
  // enemy: open tile within 2 of T, as far from the start as possible
  var best=null,c,rw;
  for(c=0;c<st.cols;c++)for(rw=0;rw<st.rows;rw++){var h=H.fromOffset(c,rw);
    if(!R.passable(st,h.q,h.r)||K(h)===K(T)||H.dist(h,T)>2||H.dist(h,T)<1)continue;
    if(!best||H.dist(s1,h)>H.dist(s1,best))best=h;}
  put(e,H.toOffset(best.q,best.r).c,H.toOffset(best.q,best.r).row);
  e.hp=e.maxHp=Math.max(e.hp,20);e.def=0;
  // land: legal tile for unit 2 (with unit 1 standing on T), farthest from its start
  var keep={q:u1.q,r:u1.r};u1.q=T.q;u1.r=T.r;
  var s2={q:u2.q,r:u2.r},l2=R.legalMoves(st,u2).filter(function(m){return K(m)!==K(T)&&K(m)!==K(e);}),L=l2.sort(function(a,b){return H.dist(s2,b)-H.dist(s2,a);})[0];
  u1.q=keep.q;u1.r=keep.r;
  st.land[K(L)]=null;st.landTiles=[K(L)];
  v.stage={u1:u1.id,u2:u2.id,e:e.id,T:K(T),L:K(L)};
};

ST.info=function(v){
  var g=v.stage,st=v.st,a=R.unitById(st,g.u1),b=R.unitById(st,g.u2),e=R.unitById(st,g.e),sel=v.sel,id;
  if(!a.moved)id=sel===a.id?"move1":"pick1";
  else if(!a.acted&&!e.dead)id="attack";
  else if(!b.moved)id=sel===b.id?"move2":"pick2";
  else if(st.land[g.L]!=="A")id="claim";
  else id="end";
  var o={id:id,n:ORDER.indexOf(id)+1,text:TEXT[id],unit:null,tile:null,enemy:null,btn:null};
  if(id==="attack"&&v.preview){o.text=TEXT.confirm;o.btn="pvconfirm";}
  if(id==="pick1")o.unit=a.id;if(id==="pick2")o.unit=b.id;
  if(id==="move1")o.tile=g.T;if(id==="move2")o.tile=g.L;
  if(id==="attack")o.enemy=e.id;
  if(id==="claim")o.btn="claim";if(id==="end")o.btn="end";
  return o;
};
ST.legal=function(v,list){var i=ST.info(v);return i.tile?list.filter(function(m){return K(m)===i.tile;}):[];};
ST.ok=function(v,kind,arg){
  var i=ST.info(v),g=v.stage,ok=false;
  if(kind==="unit")ok=(i.id==="pick1"&&arg===g.u1)||(i.id==="pick2"&&arg===g.u2)||(i.id==="attack"&&arg===g.e)||(i.id==="move1"&&arg===g.u1)||(i.id==="move2"&&arg===g.u2);
  else if(kind==="tile")ok=!!i.tile&&arg===i.tile;
  else if(kind==="act")ok=i.btn===arg;
  else if(kind==="pv")ok=i.id==="attack";
  if(!ok)SE.toast("Follow the highlight: "+i.text);
  return ok;
};
ST.banner=function(v){var i=ST.info(v);return '<div class="hint stage"><span><b>Step '+i.n+' of '+ORDER.length+'.</b> '+i.text+'</span></div>';};
ST.decorate=function(v){var i=ST.info(v);if(i.btn){var b=v.root.querySelector(i.btn==="pvconfirm"?'[data-pv="confirm"]':'[data-act="'+i.btn+'"]');if(b)b.classList.add("primary","pulse");}};
ST.finish=function(v){

  var d=G.document.createElement("div");d.className="overlay";
  d.innerHTML='<div class="modal" role="dialog" aria-label="Lesson done"><h2>That is the whole loop</h2><p class="ttext">Move, attack, claim, end turn. Real matches add chests, the Old Hermit and Wardens, and hints will point them out as you meet them.</p><button class="primary" id="s-go">'+v.st.opts.stageNext+'</button></div>';
  G.document.body.appendChild(d);var b=d.querySelector("#s-go");b.focus();
  b.addEventListener("click",function(){d.remove();SE.ui.stop(v);v.onExit("stagedone");});
};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>// Match view: SVG board, panels, input (mouse/touch/keyboard), CPU turns, match clock, hints.

  shade:function(hex,f){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,t=f<0?0:255,k=Math.abs(f);

  clickTile:function(v,q,r){

    if(v.st.npc.q===q&&v.st.npc.r===r){toast(H.dist(cur,v.st.npc)<=1?"Press Talk to speak with the "+v.st.npc.name+".":"Move next to the "+v.st.npc.name+" to talk.");SE.ui.render(v);return;}

  afterMove:function(v,u){

    else if(st.units.some(function(b){return b.boss&&!b.dead&&H.dist(b,u)<=1;}))SE.ui.hint(v,"boss");
    else SE.ui.hint(v,"moved");

  tryAttack:function(v,u,t){

  doAct:function(v,a){

    v.newTech=v.newTech||{};v.unlockSeen=v.unlockSeen||{};
    R.alive(v.st,"A").forEach(function(u){u.techs.forEach(function(id){var t=R.tech(id),k=u.id+":"+id;
      if(t.copy&&!v.unlockSeen[k]){v.unlockSeen[k]=1;v.newTech[k]=1;toast(u.name+" copied a technique: "+t.name+" (one use)");}
      if((t.unlock||1)>1&&u.level>=t.unlock&&!v.unlockSeen[k]){v.unlockSeen[k]=1;v.newTech[k]=1;
        if(SE.store.settings().hints&&v.st.opts.hints){v.hintText=u.name+" reached level "+u.level+"! "+t.name+" is unlocked"+(u.maxChi.p>0?" and your chi reserve grew":"")+". Look for the glowing button.";}}});});
  },
  maybeCpu:function(v){
    if(v.st.over||v.st.turn!=="B"||v.cpuBusy)return;
    v.cpuBusy=true;SE.ui.render(v);
    var step=function(){
      if(v.ended)return;
      if(v.paused||v.overlay){v.timers.push(G.setTimeout(step,300));return;}
      var st=v.st;if(st.over){v.cpuBusy=false;SE.ui.afterAction(v);return;}
      var a=AI.nextAction(st);
      if(a){var r=AI.apply(st,a);if(!r.ok)a.unit.idle=true;v.sel=a.unit.id;SE.ui.render(v);v.timers.push(G.setTimeout(step,a.type==="move"?420:620));}
      else{R.endTurn(st);v.cpuBusy=false;v.sel=null;SE.ui.afterAction(v);}
    };
    v.timers.push(G.setTimeout(step,500));
  },
  openGuide:function(v){
    v.paused=true;SE.tutorial.guide({faction:v.st.factions.A,opponent:v.st.factions.B,goal:v.st.opts.pointLimit<100000?v.st.opts.pointLimit:75},function(){v.paused=false;});
  },
  pauseMenu:function(v){
    v.paused=true;var d=G.document.createElement("div");d.className="overlay";var prac=v.st.opts.practice;
    d.innerHTML='<div class="modal"><h2>Paused</h2><p class="note">The match clock is stopped.</p><button class="primary" id="p-res">Resume</button><button id="p-how">How to play</button><a class="btn" href="'+SE.links.feedback+'" target="_blank" rel="noopener">Send feedback</a>'+
      '<label class="row" style="justify-content:center"><input type="checkbox" id="p-conf"'+(SE.store.settings().confirmAttacks?" checked":"")+'> Preview attacks before they happen</label>'+
      '<label class="row" style="justify-content:center"><input type="checkbox" id="p-snd"'+(SE.store.settings().sound?" checked":"")+'> Sound effects</label>'+
      '<label class="row" style="justify-content:center"><input type="checkbox" id="p-anim"'+(SE.store.settings().animations?" checked":"")+'> Attack animations</label>'+
      '<label class="row" style="justify-content:center"><input type="checkbox" id="p-hints"'+(SE.store.settings().hints?" checked":"")+'> On-screen hints</label>'+
      (prac?'<button id="p-restart">Restart practice</button>':"")+'<button id="p-quit">Quit to main menu</button></div>';
    G.document.body.appendChild(d);
    $("#p-res",d).addEventListener("click",function(){v.paused=false;d.remove();});
    $("#p-how",d).addEventListener("click",function(){d.remove();SE.ui.openGuide(v);});
    $("#p-conf",d).addEventListener("change",function(e){SE.store.set("confirmAttacks",e.target.checked);v.preview=null;});
    $("#p-snd",d).addEventListener("change",function(e){SE.store.set("sound",e.target.checked);if(e.target.checked)SE.fx.sound("click");});
    $("#p-anim",d).addEventListener("change",function(e){SE.store.set("animations",e.target.checked);});
    $("#p-hints",d).addEventListener("change",function(e){SE.store.set("hints",e.target.checked);if(!e.target.checked)v.hintText=null;SE.ui.render(v);});
    var rs=$("#p-restart",d);if(rs)rs.addEventListener("click",function(){d.remove();var o=Object.assign({},v.st.opts,{seed:(Date.now()&0xffffff)});SE.ui.stop(v);v.onExit("restart",o);});
    $("#p-quit",d).addEventListener("click",function(){d.remove();SE.ui.stop(v);v.onExit("quit");});
    $("#p-res",d).focus();
  },
  onKey:function(v,e){
    if(v.paused||v.overlay||v.ended)return;
    var K=SE.store.keys(),key=e.key.length===1?e.key.toLowerCase():e.key.toLowerCase();
    var map={};Object.keys(K).forEach(function(n){map[K[n]]=n;});var name=map[key];if(!name)return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(!SE.ui.isMyTurn(v))return;
    e.preventDefault();var st=v.st,u=SE.ui.sunit(v);
    if(v.stage&&["nextUnit","cancel","tech1","tech2","tech3"].indexOf(name)>=0)return;
    var dirs={cursorSE:0,cursorNE:1,cursorN:2,cursorNW:3,cursorSW:4,cursorS:5};
    if(name in dirs){
      var base=v.cursor||(u?{q:u.q,r:u.r}:R.alive(st,"A")[0]),d=H.DIRS[dirs[name]],nq=base.q+d[0],nr=base.r+d[1];
      if(R.inBoard(st,nq,nr))v.cursor={q:nq,r:nr};SE.ui.render(v);return;
    }
    if(name==="nextUnit"){
      var mine=R.alive(st,"A"),i=u?mine.findIndex(function(x){return x.id===u.id;}):-1,n=mine[(i+1)%mine.length];SE.ui.select(v,n);SE.ui.render(v);return;
    }
    if(name==="cancel"){v.preview=null;v.sel=null;v.tech=null;v.cursor=null;SE.ui.render(v);return;}
    if(name==="endTurn"){SE.ui.endTurn(v);return;}
    if(name==="tech1"||name==="tech2"||name==="tech3"){if(u&&u.side==="A"){var id=u.techs[+name.charAt(4)-1];if(id)SE.ui.pickTech(v,id);}return;}
    if(name==="claim"||name==="open"||name==="talk"){SE.ui.doAct(v,name);return;}
    if(name==="confirm"){
      if(!v.cursor){var f=R.alive(st,"A")[0];SE.ui.clickUnit(v,f.id);return;}
      var at=R.unitAt(st,v.cursor.q,v.cursor.r);
      if(at){SE.ui.clickUnit(v,at.id);return;}
      SE.ui.clickTile(v,v.cursor.q,v.cursor.r);
    }
  }
};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>// Screens and flow: main menu, faction pick, Quick Play / Custom Match, tutorial cards, options, result.
(function(G){var SE=G.SE=G.SE||{data:{}};
var R=SE.rules,M=SE.menu={},root,flow={};
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(s,r){return (r||root).querySelector(s);}
function on(sel,fn,r){var e=$(sel,r);if(e)e.addEventListener("click",fn);}
function screen(html){root.innerHTML='<div class="screen">'+html+'</div>';}
var HERO='<svg class="hero" viewBox="0 0 320 170" role="img" aria-label="Star Evolution title art (placeholder)"><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e8b84a" stop-opacity="0"/></radialGradient></defs>'+
 '<circle cx="160" cy="85" r="80" fill="url(#g)" opacity=".45"/><polygon points="160,15 176,70 232,70 186,102 204,157 160,124 116,157 134,102 88,70 144,70" fill="#e8b84a" stroke="#fff3c9" stroke-width="3"/>'+
 '<polygon points="52,120 64,100 76,120 64,140" fill="#8a6bd6"/><circle cx="262" cy="118" r="12" fill="#e8b84a" stroke="#000" stroke-width="2"/></svg>';

M.boot=function(el){root=el;SE.store.apply();if(SE.assets&&SE.assets.map)G.document.documentElement.style.setProperty('--mapbg','url("'+SE.assets.map+'")');M.title();};
M.title=function(){
  screen((SE.assets&&SE.assets.title?'<img class="cover" alt="Star Evolution title art" src="'+SE.assets.title+'">':HERO)+'<h1 class="logo sr">STAR EVOLUTION</h1><p class="sub">Take land. Take risks. Take the stars.</p>'+
   '<div class="menu"><button class="primary" id="m-start">Start Game</button><button id="m-builder">Faction Builder</button><button id="m-practice">Practice Mode</button><button id="m-options">Options</button><a class="btn" id="m-fb" href="'+SE.links.feedback+'" target="_blank" rel="noopener">Send feedback</a><button id="m-exit">Exit Game</button></div>'+
   '<p class="note">Early test build: numbers and some art are placeholders. Your feedback shapes the game.</p>'+
   '<p class="note">Want the full game? <a href="'+SE.links.mod+'" target="_blank" rel="noopener">Get the Tabletop Simulator mod on Steam</a>.</p>'+
   '<img class="credits" alt="Game and art designs by Evanjellen. Illustration by Pineapplelava." src="'+SE.credits+'">');
  on("#m-start",M.factionPick);
  on("#m-builder",function(){SE.toast("Faction Builder is coming in a later update.");});
  on("#m-practice",M.practice);
  on("#m-options",function(){M.options(M.title);});
  on("#m-exit",M.goodbye);
};
M.goodbye=function(){
  screen('<h1 class="logo">Thanks for playing</h1><p class="sub">You can close this tab now. A web page can\'t close itself.</p><div class="menu"><button class="primary" id="g-back">Back to main menu</button></div>');
  on("#g-back",M.title);
};
M.factionPick=function(){
  var F=SE.data.units.factions,U=SE.data.units.units;
  var cards=Object.keys(F).map(function(id){var f=F[id];
    return '<div class="card" tabindex="0" role="button" data-f="'+id+'">'+(SE.art.emblem(id)?'<img class="emb big" alt="" src="'+SE.art.emblem(id)+'">':'')+'<svg width="34" height="34" viewBox="-17 -17 34 34" aria-hidden="true">'+
      (f.shape==="circle"?'<circle r="13" fill="'+f.color+'"/>':f.shape==="square"?'<rect x="-12" y="-12" width="24" height="24" rx="3" fill="'+f.color+'"/>':'<polygon points="0,-16 14,0 0,16 -14,0" fill="'+f.color+'"/>')+'</svg><h3>'+esc(f.name)+'</h3><ul>'+
      f.roster.map(function(u){var d=U[u],hd=SE.art.head(u);return '<li>'+(hd?'<img class="th" alt="" src="'+hd+'"> ':'')+esc(d.name)+' · HP '+d.hp+' DEF '+d.def+'</li>';}).join("")+'</ul>'+M.edgeNote(id)+'</div>';}).join("");
  screen('<h2>Pick your faction</h2><div class="cards">'+cards+'</div><div class="menu"><button id="f-back">Back</button></div>');
  root.querySelectorAll("[data-f]").forEach(function(e){var go=function(){flow.faction=e.getAttribute("data-f");M.modePick();};
    e.addEventListener("click",go);e.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go();}});});
  on("#f-back",M.title);
};
M.edgeNote=function(id){var E=SE.data.rules.factionEdge,F=SE.data.units.factions;if(!E)return "";
  var beats=E.beats[id],loses=Object.keys(E.beats).filter(function(k){return E.beats[k]===id;})[0];
  var pas=SE.data.instincts&&SE.data.instincts.passives[id];
  return '<p class="note edgenote"><span class="edge up">\u25B2 +'+E.bonus+' vs '+esc(F[beats].name)+'</span><br><span class="edge dn">\u25BC -'+E.penalty+' vs '+esc(F[loses].name)+'</span>'+(pas?'<br><span class="note">Passive: '+esc(pas.name)+'</span>':'')+'</p>';};
M.modePick=function(){
  var d=SE.data.rules.defaults;
  screen('<h2>'+esc(SE.data.units.factions[flow.faction].name)+'</h2><div class="cards"><div class="card" tabindex="0" role="button" id="q-quick"><h3>Quick Play</h3><p class="note">Units picked for you. Basic rules, first to '+d.pointLimit+' star points or '+d.clockMin+' minutes. Straight into the match.</p></div>'+
   '<div class="card" tabindex="0" role="button" id="q-custom"><h3>Custom Match</h3><p class="note">Pick the rules, the goal and the limits.</p></div></div><div class="menu"><button id="q-back">Back</button></div>');
  var q=function(){M.beforeMatch(M.baseOpts());},c=function(){M.custom();};
  on("#q-quick",q);on("#q-custom",c);on("#q-back",M.factionPick);
  [["#q-quick",q],["#q-custom",c]].forEach(function(p){$(p[0]).addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();p[1]();}});});
};
M.baseOpts=function(){var d=SE.data.rules.defaults;
  return {faction:flow.faction,rules:"basic",pointLimit:d.pointLimit,clockMin:d.clockMin,roundLimit:d.roundLimit,respawn:d.respawn,firstSide:d.firstSide,hints:SE.store.settings().hints,seed:(Date.now()&0xffffff)};};
M.custom=function(){
  var L=SE.data.rules.limits,d=SE.data.rules.defaults,o=flow.custom||{pt:true,ptv:d.pointLimit,cl:true,clv:d.clockMin,rd:false,rdv:d.roundLimit,rs:d.respawn,hints:SE.store.settings().hints};
  screen('<h2>Custom Match</h2><div class="form">'+
   '<div class="row"><b>Rules</b><span><select id="c-rules" aria-label="Rules"><option>Basic</option><option disabled>Standard (coming soon)</option></select></span></div>'+
   '<p class="note" style="margin:0">Basic: unit attacks, movement, land, chests, NPC. No magic cards or gods. Standard (harder CPU, harder wins, magic cards) comes later.</p>'+
   '<div class="row"><label><input type="checkbox" id="c-pt"> Star point goal</label><span id="c-ptl"></span><input type="range" id="c-ptv" min="'+L.pointMin+'" max="'+L.pointMax+'" step="10"></div>'+
   '<div class="row"><label><input type="checkbox" id="c-cl"> Match clock (minutes)</label><span id="c-cll"></span><input type="range" id="c-clv" min="'+L.clockMin+'" max="'+L.clockMax+'" step="1"></div>'+
   '<div class="row"><label><input type="checkbox" id="c-rd"> Round limit</label><span id="c-rdl"></span><input type="range" id="c-rdv" min="'+L.roundMin+'" max="'+L.roundMax+'" step="1"></div>'+
   '<p class="note" style="margin:0">Use one limit or several. The first to trigger ends the match; on a clock or round limit the higher score wins.</p>'+
   '<div class="row"><label><input type="checkbox" id="c-rs"> Defeated units return at base (half HP)</label></div>'+
   '<div class="row"><label><input type="checkbox" id="c-hints"> On-screen hints</label></div>'+
   '</div><div class="menu"><button class="primary" id="c-go">Start match</button><button id="c-back">Back</button></div>');
  function setv(id,val,isChk){var e=$("#"+id);if(isChk)e.checked=!!val;else e.value=val;}
  setv("c-pt",o.pt,1);setv("c-ptv",o.ptv);setv("c-cl",o.cl,1);setv("c-clv",o.clv);setv("c-rd",o.rd,1);setv("c-rdv",o.rdv);setv("c-rs",o.rs,1);setv("c-hints",o.hints,1);
  function lab(){$("#c-ptl").textContent=$("#c-ptv").value;$("#c-cll").textContent=$("#c-clv").value;$("#c-rdl").textContent=$("#c-rdv").value;
    [["pt"],["cl"],["rd"]].forEach(function(k){$("#c-"+k[0]+"v").disabled=!$("#c-"+k[0]).checked;});}
  ["c-pt","c-ptv","c-cl","c-clv","c-rd","c-rdv"].forEach(function(id){$("#"+id).addEventListener("input",lab);});lab();
  function read(){return {pt:$("#c-pt").checked,ptv:+$("#c-ptv").value,cl:$("#c-cl").checked,clv:+$("#c-clv").value,rd:$("#c-rd").checked,rdv:+$("#c-rdv").value,rs:$("#c-rs").checked,hints:$("#c-hints").checked};}
  on("#c-go",function(){
    var v=read();if(!v.pt&&!v.cl&&!v.rd){v.pt=true;SE.toast("No limit picked: using the star point goal.");}
    flow.custom=v;
    var opts=M.baseOpts();opts.pointLimit=v.pt?v.ptv:100000;opts.clockMin=v.cl?v.clv:0;opts.roundLimit=v.rd?v.rdv:0;opts.respawn=v.rs;opts.hints=v.hints;
    M.beforeMatch(opts);});
  on("#c-back",function(){flow.custom=read();M.modePick();});
};
M.beforeMatch=function(opts){
  if(SE.store.settings().seenTutorial){M.play(opts);return;}
  SE.tutorial.run({faction:opts.faction,opponent:opts.opponent,goal:opts.pointLimit},{startLabel:"Try a guided turn",showSkip:true,
    onSkip:function(){SE.store.set("seenTutorial",true);M.play(opts);},
    onDone:function(){M.stage(opts.faction,"Start match",function(){SE.store.set("seenTutorial",true);M.play(opts);});}});
};
// Guided tutorial stage: one scripted turn. Skip or finish both call `after`.
M.stage=function(faction,label,after){
  SE.ui.start(root,SE.stage.opts(faction,label),function(){after();});
};
// Practice Mode: any faction vs any, guide always on hand
M.practice=function(){
  var F=SE.data.units.factions,ids=Object.keys(F),p=flow.practice||{me:ids[0],opp:ids[1]||ids[0],first:"random",goal:"75"};
  function opts(sel){return ids.map(function(id){return '<option value="'+id+'"'+(sel===id?" selected":"")+'>'+esc(F[id].name)+'</option>';}).join("");}
  screen('<h2>Practice Mode</h2><div class="form"><p class="note" style="margin:0">Learn at your own pace. No clock, hints on, and a Guide button on the match screen (tutorial, points, unit stats).</p>'+
   '<div class="field"><label for="p-me">You play</label><select id="p-me">'+opts(p.me)+'</select></div>'+
   '<div class="field"><label for="p-opp">CPU plays</label><select id="p-opp">'+opts(p.opp)+'</select></div>'+
   '<div class="field"><label for="p-first">Who moves first</label><select id="p-first"><option value="random">Random</option><option value="A">You</option><option value="B">CPU</option></select></div>'+
   '<div class="field"><label for="p-goal">Star point goal</label><select id="p-goal"><option value="50">50</option><option value="75">75</option><option value="100">100</option><option value="0">No goal (play until you quit)</option></select></div></div>'+
   '<div class="menu"><button class="primary" id="p-go">Start practice</button><button id="p-guide">Open the guide</button><button id="p-back">Back</button></div>');
  $("#p-first").value=p.first;$("#p-goal").value=p.goal;
  function read(){return {me:$("#p-me").value,opp:$("#p-opp").value,first:$("#p-first").value,goal:$("#p-goal").value};}
  on("#p-go",function(){var v=read();flow.practice=v;
    M.beforeMatch({faction:v.me,opponent:v.opp,rules:"basic",pointLimit:+v.goal||100000,clockMin:0,roundLimit:0,respawn:true,firstSide:v.first,hints:true,practice:true,seed:(Date.now()&0xffffff)});});
  on("#p-guide",function(){var v=read();flow.practice=v;SE.tutorial.guide({faction:v.me,opponent:v.opp,goal:+v.goal||75});});
  on("#p-back",function(){flow.practice=read();M.title();});
};
M.play=function(opts){
  flow.lastOpts=opts;
  SE.ui.start(root,opts,function(kind,st,extra){
    if(kind==="result")M.result(st,extra);else if(kind==="restart")M.play(st);else M.title();});
};
M.result=function(st,extra){
  var win=st.winner==="A"?"You win!":st.winner==="B"?"The CPU wins":"Draw";
  var mins=Math.floor(extra.elapsed/60000),secs=Math.floor(extra.elapsed/1000)%60;
  function row(l,a,b){return '<tr><th>'+l+'</th><td>'+a+'</td><td>'+b+'</td></tr>';}
  screen('<h1 class="logo" style="font-size:2rem">'+win+'</h1><p class="sub">'+esc(st.endReason)+' · round '+st.round+' · '+mins+':'+("0"+secs).slice(-2)+' played</p>'+
   '<div class="end"><table><tr><th></th><th>'+esc(st.names.A)+'</th><th>'+esc(st.names.B)+'</th></tr>'+
   row("Star points",st.points.A,st.points.B)+row("Land held",R.landCount(st,"A"),R.landCount(st,"B"))+row("Talked to Hermit",st.talked.A?"yes":"no",st.talked.B?"yes":"no")+'</table></div>'+
   '<div class="menu"><button class="primary" id="r-again">Play again</button><a class="btn" href="'+SE.links.feedback+'" target="_blank" rel="noopener">Send feedback</a><button id="r-menu">Main menu</button></div>');
  on("#r-again",function(){var o=Object.assign({},flow.lastOpts,{seed:(Date.now()&0xffffff)});M.play(o);});
  on("#r-menu",M.title);
};
M.options=function(back){
  var s=SE.store.settings(),K=SE.store.keys();
  screen('<h2>Options</h2><div class="form">'+
   '<div class="row"><label for="o-scale">Text and button size</label><span id="o-sl">'+s.uiScale+'%</span><input type="range" id="o-scale" min="80" max="160" step="10" value="'+s.uiScale+'"></div>'+
   '<div class="row"><label><input type="checkbox" id="o-cb"'+(s.colorblind?" checked":"")+'> Colour-blind mode</label></div>'+
   '<p class="note" style="margin:0">Changes palette to blue/orange. Sides are also told apart by shape (circle or diamond) and land markers.</p>'+
   '<div class="row"><label><input type="checkbox" id="o-hints"'+(s.hints?" checked":"")+'> On-screen hints</label></div>'+
   '<div class="row"><label><input type="checkbox" id="o-conf"'+(s.confirmAttacks?" checked":"")+'> Preview attacks before they happen (tap the enemy, then confirm)</label></div>'+
   '<div class="row"><label><input type="checkbox" id="o-anim"'+(s.animations?" checked":"")+'> Attack animations</label></div>'+
   '<div class="row"><label><input type="checkbox" id="o-snd"'+(s.sound?" checked":"")+'> Sound effects</label></div>'+
   '<div class="row"><label for="o-vol">Volume</label><span id="o-vl">'+s.volume+'%</span><input type="range" id="o-vol" min="0" max="100" step="10" value="'+s.volume+'"></div>'+
   '<div><b>Keyboard</b><table class="keys">'+Object.keys(SE.keyLabels).map(function(k){return '<tr><td>'+SE.keyLabels[k]+'</td><td><kbd>'+(K[k]===" "?"Space":esc(K[k]))+'</kbd></td></tr>';}).join("")+'</table>'+
   '<p class="note">Mouse and touch always work. Rebinding keys is coming in a later update.</p></div>'+
   '<button id="o-tut">Watch the tutorial now</button><button id="o-stage">Play the guided turn again</button><button id="o-reset">Show the tutorial before my next match</button></div><div class="menu"><button class="primary" id="o-back">Back</button></div>');
  $("#o-scale").addEventListener("input",function(e){$("#o-sl").textContent=e.target.value+"%";SE.store.set("uiScale",+e.target.value);});
  $("#o-cb").addEventListener("change",function(e){SE.store.set("colorblind",e.target.checked);});
  $("#o-hints").addEventListener("change",function(e){SE.store.set("hints",e.target.checked);});
  $("#o-conf").addEventListener("change",function(e){SE.store.set("confirmAttacks",e.target.checked);});
  $("#o-anim").addEventListener("change",function(e){SE.store.set("animations",e.target.checked);});
  $("#o-snd").addEventListener("change",function(e){SE.store.set("sound",e.target.checked);if(e.target.checked){SE.fx.unlock();SE.fx.sound("click");}});
  $("#o-vol").addEventListener("input",function(e){$("#o-vl").textContent=e.target.value+"%";SE.store.set("volume",+e.target.value);});
  $("#o-vol").addEventListener("change",function(){SE.fx.unlock();SE.fx.sound("hit");});
  on("#o-tut",function(){SE.tutorial.run({faction:Object.keys(SE.data.units.factions)[0]},{startLabel:"Done",showSkip:false});});
  on("#o-stage",function(){M.stage(Object.keys(SE.data.units.factions)[0],"Back to options",function(){M.options(back);});});
  on("#o-reset",function(){SE.store.set("seenTutorial",false);SE.toast("Tutorial will show before your next match.");});
  on("#o-back",back);
};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>SE.menu.boot(document.getElementById('app'));</script>
